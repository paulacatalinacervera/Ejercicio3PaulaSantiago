name: mobility

services:
  kafka:
    image: bitnamilegacy/kafka:3.7
    container_name: mobility-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:29093
      KAFKA_CFG_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  cassandra:
    image: cassandra:4.1
    container_name: mobility-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: mobility
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' >/dev/null 2>&1"]
      interval: 15s
      timeout: 15s
      retries: 30

  neo4j:
    image: neo4j:5.20-community
    container_name: mobility-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-mobility123}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
      NEO4J_dbms_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-mobility123} 'RETURN 1' >/dev/null 2>&1"]
      interval: 15s
      timeout: 15s
      retries: 20

  minio:
    image: bitnamilegacy/minio:latest
    container_name: mobility-minio
    profiles: ["local"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9000'"]
      interval: 10s
      timeout: 10s
      retries: 10

  spark:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: mobility-spark
    depends_on:
      kafka:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-mobility.gps}
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: 9042
      CASSANDRA_KEYSPACE: mobility
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-mobility123}
      LOCAL_MODE: ${LOCAL_MODE:-true}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-mobility-local}
      S3_PREFIX: ${S3_PREFIX:-mobility}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL_DOCKER:-}
    volumes:
      - ./:/opt/mobility
    working_dir: /opt/mobility
    command: ["bash", "-c", "tail -f /dev/null"]

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: mobility-dashboard
    depends_on:
      cassandra:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: 9042
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-mobility123}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-mobility-local}
      S3_PREFIX: ${S3_PREFIX:-mobility}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL_DOCKER:-}
      LOCAL_MODE: ${LOCAL_MODE:-true}
      SIM_DAY: ${SIM_DAY:-}
    volumes:
      - ./:/app
    working_dir: /app

volumes:
  kafka_data:
  cassandra_data:
  neo4j_data:
  neo4j_logs:
  minio_data:
